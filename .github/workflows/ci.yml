name: CI

# Runs the tests on the exact lockfile, so a Dependabot bump is tested before
# the merge-when-clean job can merge it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: false

      # --locked fails if uv.lock does not match pyproject.toml, instead of
      # quietly re-resolving to newer versions.
      - name: Install from the lockfile
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q
